<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolHub — เว็บจำลองโต้ตอบ</title><style>
:root{--ink:#172a47;--muted:#6f8099;--line:#e3eaf3;--bg:#f3f7fc;--blue:#2468cc;--navy:#102b56;--ok:#167955;--red:#af3751;--warn:#aa751b}*{box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,'Noto Sans Thai',sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:14px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.4}.app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{background:var(--navy);color:#dbe9ff;display:flex;flex-direction:column;padding:19px 12px;gap:15px;position:sticky;top:0;height:100vh}.brand{padding:7px 10px 18px;border-bottom:1px solid #ffffff23;display:flex;gap:9px;align-items:center}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#ffffff22;font-size:22px}.brand strong{color:white;font-size:20px}.brand small{font-size:11px;display:block;color:#a2bddf}.links{display:grid;gap:4px;align-content:start;flex:1}.links button{color:#c5d7ef;text-align:left;background:none;border:0;border-radius:10px;padding:11px 13px;display:flex;gap:11px;align-items:center}.links button.active,.links button:hover{background:#ffffff20;color:white}.links button span{font-size:17px}.side-bottom{padding:12px;border-top:1px solid #ffffff2a;color:#b5cae9;font-size:11px}.side-bottom b{color:white;display:block;margin:5px 0}.main{min-width:0}.top{padding:15px 25px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}.top h1{margin:0;font-size:21px}.top small{color:var(--muted);display:block;font-size:11px}.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}select,input{background:white;border:1px solid #d7e1ee;border-radius:9px;padding:10px;color:var(--ink)}.content{padding:25px;max-width:1340px;margin:auto}.demo{background:#fffaeb;color:#8d621e;padding:10px 16px;border-bottom:1px solid #f3e2ae;font-size:12px;display:flex;justify-content:space-between;gap:10px}.header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 21px;flex-wrap:wrap}.header h2{margin:0 0 5px;font-size:24px}.header p{margin:0;color:var(--muted);font-size:12px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat,.panel,.club{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 7px 20px #203a6110}.stat{padding:19px}.stat i{font-size:23px;font-style:normal;display:inline-grid;place-items:center;background:#eef4ff;width:39px;height:39px;border-radius:12px}.stat .value{font-size:30px;font-weight:700;display:block;margin:13px 0 2px}.stat small{color:var(--muted)}.panels{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px;margin-bottom:16px}.panel h3{margin:0 0 14px;font-size:16px}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #d7e1ee;color:#315682;background:#fff;border-radius:9px;padding:9px 13px;min-height:37px;font-size:12px}.btn:hover{background:#eff6ff}.primary{background:#2468cc;border-color:#2468cc;color:white}.primary:hover{background:#1d57ad}.danger{color:#a83b50}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input{min-width:220px;flex:1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:650px}th{text-align:left;color:#6c809c;font-size:12px;background:#f7fafd;font-weight:600;padding:12px}td{font-size:12px;border-top:1px solid #edf1f5;padding:12px}tbody tr:hover{background:#f9fbff}.pill{border-radius:99px;background:#edf3fe;color:#3267aa;display:inline-block;padding:4px 9px;font-size:11px}.pill.ok{background:#e8f6ef;color:#167955}.pill.warn{background:#fff2dd;color:#976419}.pill.red{background:#feeef1;color:#ae3b50}.muted{color:var(--muted)}.pbar{height:9px;background:#e9eff9;border-radius:99px;overflow:hidden;margin:10px 0}.pbar div{height:100%;background:#2f78d6;border-radius:99px}.row{padding:11px 0;border-bottom:1px solid #edf2f8;display:flex;justify-content:space-between;gap:10px;align-items:center}.row:last-child{border:0}.row small{color:var(--muted)}.clubgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.club{padding:16px}.club h3{margin:0 0 5px}.club p{margin:0 0 12px;color:var(--muted);font-size:12px}.club .foot{display:flex;justify-content:space-between;align-items:center}.notice{background:#eff6ff;border:1px solid #d8e7fc;color:#3a6396;border-radius:12px;padding:13px 15px;font-size:12px;margin-bottom:16px}.notice.warn{background:#fff8eb;color:#996b2d;border-color:#f2dfb5}.mobilemenu{display:none}.hidden{display:none!important}.empty{padding:25px;text-align:center;color:var(--muted)}.editbox{display:grid;gap:12px}.editbox label{display:grid;gap:6px;font-size:12px;color:#536985}.modalwrap{position:fixed;inset:0;background:#0a1b36aa;z-index:99;display:grid;place-items:center;padding:15px}.modal{background:white;max-height:92vh;overflow-y:auto;width:min(540px,100%);border-radius:17px;padding:22px;box-shadow:0 28px 70px #0004}.modal h2{margin:0 0 13px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:22px;right:20px;z-index:120;background:#11345f;color:white;border-radius:10px;padding:12px 18px;box-shadow:0 12px 30px #0014;font-size:12px}.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.att{display:flex;flex-wrap:wrap;gap:5px}.att button{border:1px solid #dae3ed;background:white;border-radius:7px;padding:6px 9px;font-size:11px}.att button.selected{background:#d9e9ff;border-color:#6ca9f7;color:#1b5db4}.small{font-size:12px;color:var(--muted)}.meta{font-size:12px;color:#5a718e}.number{font-variant-numeric:tabular-nums}.mobileoverlay{display:none}@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.clubgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:780px){.app{display:block}.side{position:fixed;z-index:50;left:-255px;width:235px;transition:left .2s}.app.open .side{left:0}.app.open .mobileoverlay{display:block;position:fixed;inset:0;background:#0019;z-index:40}.mobilemenu{display:inline-block}.content{padding:16px}.top{padding:13px 15px}.top h1{font-size:17px}.top select{max-width:130px}.panels,.cards2{grid-template-columns:1fr}.header h2{font-size:21px}.clubgrid{grid-template-columns:1fr}.filters input{min-width:100%}}
</style></head><body><div class="app" id="app"><div class="mobileoverlay" id="overlay"></div><aside class="side"><div class="brand"><span class="logo">🏫</span><div><strong>SchoolHub</strong><small>ระบบบริหารกิจกรรมโรงเรียน</small></div></div><nav class="links" id="links"></nav><div class="side-bottom">บัญชีที่กำลังทดลอง<b id="roleName">Super Admin (จำลอง)</b><span>ไม่มีการเชื่อมต่อข้อมูลจริง</span></div></aside><div class="main"><div class="demo"><span>🧪 <b>โหมดสาธิตแบบโต้ตอบ</b> — ข้อมูลนักเรียนเป็นข้อมูลสมมติทั้งหมด และไม่บันทึกขึ้น Cloud</span><button class="btn" id="reset" style="padding:4px 9px;min-height:0">รีเซ็ตตัวอย่าง</button></div><header class="top"><div style="display:flex;align-items:center;gap:11px"><button class="btn mobilemenu" id="menu">☰</button><div><small>ระบบโรงเรียน / <span id="crumb">ภาพรวม</span></small><h1 id="pageTitle">ภาพรวมโรงเรียน</h1></div></div><div class="topright"><select id="role" aria-label="เลือกบทบาท"><option value="super">Super Admin</option><option value="admin">Admin</option><option value="teacher">ครูประจำชั้น</option><option value="club">ครูประจำชุมนุม</option></select><select id="year" aria-label="ปีการศึกษา"><option value="2569">ปี 2569</option><option value="2570">ปี 2570 (ตัวอย่าง)</option></select></div></header><main class="content" id="main"></main></div></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(function(){'use strict';const original=[{id:'SIM-001',code:'690001',name:'ด.ช. ธนกฤต ตัวอย่าง',room:'ม.1/1',club:'คอมพิวเตอร์',version:1},{id:'SIM-002',code:'690002',name:'ด.ญ. ปาริชาติ ตัวอย่าง',room:'ม.1/1',club:'ฟุตบอล',version:1},{id:'SIM-003',code:'690003',name:'ด.ช. ชนาธิป ตัวอย่าง',room:'ม.1/2',club:'ดนตรี',version:1},{id:'SIM-004',code:'690004',name:'ด.ญ. ณิชากร ตัวอย่าง',room:'ม.2/1',club:'ศิลปะ',version:1},{id:'SIM-005',code:'690005',name:'ด.ช. นรินทร์ ตัวอย่าง',room:'ม.2/1',club:'ฟุตบอล',version:1},{id:'SIM-006',code:'690006',name:'ด.ญ. กัญญารัตน์ ตัวอย่าง',room:'ม.3/2',club:'คอมพิวเตอร์',version:1},{id:'SIM-007',code:'690007',name:'ด.ช. พีรวิชญ์ ตัวอย่าง',room:'ม.4/1',club:'',version:1},{id:'SIM-008',code:'690008',name:'น.ส. อลิสา ตัวอย่าง',room:'ม.5/1',club:'ดนตรี',version:1},{id:'SIM-009',code:'690009',name:'นาย ภูมิพัฒน์ ตัวอย่าง',room:'ม.6/1',club:'ฟุตบอล',version:1}];const clubDefs=[{name:'คอมพิวเตอร์',limit:30,staff:'ครู A, ครู B'},{name:'ฟุตบอล',limit:40,staff:'ครู C'},{name:'ดนตรี',limit:25,staff:'ครู D, ครู E'},{name:'ศิลปะ',limit:null,staff:'ครู F'}];let students=JSON.parse(JSON.stringify(original)),view='dashboard',role='super',year='2569',query='',roomFilter='',clubFilter='',attend={},logs=[{type:'ระบบ',detail:'เปิดหน้าเว็บสาธิต',date:'วันนี้'}],notices=45;const pages=[['dashboard','▦','ภาพรวม'],['students','♟','นักเรียน'],['clubs','◈','ชุมนุม'],['rooms','▤','ห้องเรียน'],['attendance','☑','เช็กชื่อกิจกรรม'],['excel','⇩','นำเข้า / ส่งออก Excel'],['issues','⚑','ข้อมูลรอตรวจสอบ'],['users','♧','บัญชีและสิทธิ์'],['logs','☷','ประวัติการแก้ไข']];let main=document.getElementById('main');function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const byId=id=>document.getElementById(id);const counts=n=>students.filter(s=>s.club===n).length;const canEditStudent=()=>role==='super'||role==='admin'||role==='teacher';const canClub=()=>role!=='teacher'||true;function scopeRows(arr=students){if(role==='teacher')return arr.filter(s=>s.room==='ม.1/1');if(role==='club')return arr.filter(s=>s.club==='คอมพิวเตอร์');return arr}function pageAllowed(id){if(role==='teacher')return !['users','issues'].includes(id);if(role==='club')return !['users','issues','rooms'].includes(id);if(role==='admin')return id!=='issues'||true;return true}function toast(msg){byId('toastRoot').innerHTML='<div class="toast">'+safe(msg)+'</div>';setTimeout(()=>{byId('toastRoot').innerHTML=''},2600)}function nav(v){view=v;query='';roomFilter='';clubFilter='';byId('app').classList.remove('open');render()}function drawNav(){byId('links').innerHTML=pages.filter(p=>pageAllowed(p[0])).map(p=>`<button data-nav="${p[0]}" class="${view===p[0]?'active':''}"><span>${p[1]}</span>${p[2]}</button>`).join('');byId('links').querySelectorAll('button').forEach(b=>b.onclick=()=>nav(b.dataset.nav))}function head(title,subtitle,tools=''){return `<div class="header"><div><h2>${title}</h2><p>${subtitle}</p></div><div class="actions">${tools}</div></div>`}function render(){if(!pageAllowed(view))view='dashboard';drawNav();byId('roleName').textContent={super:'Super Admin (จำลอง)',admin:'Admin (จำลอง)',teacher:'ครู ม.1/1 (จำลอง)',club:'ครูชุมนุมคอมพิวเตอร์ (จำลอง)'}[role];const label=pages.find(p=>p[0]===view)?.[2]||'ภาพรวม';byId('crumb').textContent=label;byId('pageTitle').textContent=label;main.innerHTML=({dashboard:dashboard,students:studentPage,clubs:clubPage,rooms:roomPage,attendance:attendancePage,excel:excelPage,issues:issuesPage,users:usersPage,logs:logPage}[view]||dashboard)();bind()}
function dashboard(){const total=role==='super'||role==='admin'?'1,166':String(scopeRows().length);return head('ภาพรวมโรงเรียน','ปีการศึกษา '+year+' · ข้อมูลภาพรวมจากระบบจริงเป็นยอดสรุป ส่วนรายชื่อด้านล่างเป็นข้อมูลสมมติ')+`<div class="grid stats"><div class="stat"><i>🎓</i><strong class="value">${total}</strong><small>นักเรียนทั้งหมด ${role==='teacher'||role==='club'?'(เฉพาะสิทธิ์)':'(ยอดจากชุดข้อมูลปี 2569)'}</small></div><div class="stat"><i>🏫</i><strong class="value">33</strong><small>ห้องเรียน (ข้อมูลปี 2569)</small></div><div class="stat"><i>🧩</i><strong class="value">43</strong><small>ชุมนุม (รอยืนยันชื่อบางรายการ)</small></div><div class="stat"><i>⚠️</i><strong class="value">45</strong><small>รายการจากต้นฉบับที่ต้องตรวจสอบ</small></div></div><div class="panels"><div class="panel"><h3>📋 การจัดสรรชุมนุม — ตัวอย่างการทำงาน</h3><p class="small">ข้อมูลสาธิต ${students.length} คน · มีชุมนุมแล้ว ${students.filter(s=>s.club).length} คน</p><div class="pbar"><div style="width:${Math.round(students.filter(s=>s.club).length/students.length*100)}%"></div></div><div class="row"><span>นักเรียนยังไม่มีชุมนุม</span><span class="pill warn">${students.filter(s=>!s.club).length} คน</span></div><div class="row"><span>รายชื่อพร้อมตรวจสอบและแก้ไข</span><span class="pill ok">พร้อมทดลอง</span></div><div class="actions" style="margin-top:16px"><button class="btn primary" data-go="students">ดูรายชื่อนักเรียน</button><button class="btn" data-go="excel">นำเข้า / ส่งออก</button></div></div><div class="panel"><h3>🔔 รายการที่ควรตรวจสอบ</h3><div class="row"><div><b>ข้อมูล Excel ต้นฉบับ</b><br><small>ชื่อชุมนุมและเลขนักเรียนบางรายการ</small></div><span class="pill warn">45 รายการ</span></div><div class="row"><div><b>ข้อมูลชุมนุม</b><br><small>ยืนยันชื่อและครูผู้รับผิดชอบ</small></div><span class="pill">43 รายการ</span></div><div class="row"><div><b>โหมดเว็บไซต์</b><br><small>ข้อมูลสมมติ ไม่เชื่อม Cloud</small></div><span class="pill ok">ปลอดภัยต่อการทดลอง</span></div></div></div>`}
function studentPage(){let rows=scopeRows().filter(s=>(!roomFilter||s.room===roomFilter)&&(!clubFilter||s.club===clubFilter)&&(!query||[s.name,s.code,s.room,s.club].join(' ').toLowerCase().includes(query.toLowerCase())));return head('จัดการนักเรียน','ค้นหา แก้ไข และย้ายชุมนุมโดยไม่กระทบข้อมูลจริง',`<button class="btn primary" id="newstudent" ${!canEditStudent()?'disabled':''}>+ เพิ่มนักเรียน</button>`)+`<div class="panel"><div class="filters"><input id="search" placeholder="ค้นหาชื่อหรือเลขประจำตัว" value="${safe(query)}"/><select id="roomFilter"><option value="">ทุกห้อง</option>${[...new Set(students.map(s=>s.room))].sort().map(x=>`<option ${roomFilter===x?'selected':''}>${x}</option>`).join('')}</select><select id="clubFilter"><option value="">ทุกชุมนุม</option>${clubDefs.map(x=>`<option ${clubFilter===x.name?'selected':''}>${x.name}</option>`).join('')}<option value="__none" ${clubFilter==='__none'?'selected':''}>ยังไม่มีชุมนุม</option></select><button class="btn" id="apply">ค้นหา</button></div><div class="tablewrap"><table><thead><tr><th>เลขประจำตัว</th><th>นักเรียน</th><th>ห้อง</th><th>ชุมนุม</th><th>จัดการ</th></tr></thead><tbody>${rows.length?rows.map(s=>`<tr><td class="number">${safe(s.code)}</td><td><b>${safe(s.name)}</b></td><td>${safe(s.room)}</td><td>${s.club?`<span class="pill">${safe(s.club)}</span>`:'<span class="pill warn">ยังไม่เลือก</span>'}</td><td><button class="btn" data-move="${s.id}">ย้ายชุมนุม</button> ${canEditStudent()?`<button class="btn" data-edit="${s.id}">แก้ไข</button>`:''}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">ไม่พบข้อมูล</td></tr>'}</tbody></table></div><p class="small" style="margin-bottom:0">แสดง ${rows.length} รายการจากข้อมูลตัวอย่าง · บัญชีครูเห็นเฉพาะข้อมูลที่จำลองสิทธิ์ไว้</p></div>`}
function clubPage(){let ds=role==='club'?clubDefs.filter(c=>c.name==='คอมพิวเตอร์'):clubDefs;return head('ชุมนุม','ดูความจุและรายชื่อสมาชิกในแต่ละชุมนุม')+`<div class="clubgrid">${ds.map(c=>`<div class="club"><h3>◈ ${c.name}</h3><p>${c.staff}</p><div class="foot"><div><strong>${counts(c.name)} คน</strong><span class="muted"> / ${c.limit||'ไม่จำกัด'}</span></div><span class="pill ${c.limit&&counts(c.name)>=c.limit?'warn':'ok'}">${c.limit&&counts(c.name)>=c.limit?'เต็ม':'รับสมาชิกได้'}</span></div><div class="pbar"><div style="width:${c.limit?Math.min(100,counts(c.name)/c.limit*100):30}%"></div></div><button class="btn" data-club="${c.name}">ดูสมาชิกชุมนุม</button></div>`).join('')}</div>`}
function roomPage(){const rms=[...new Set(students.map(s=>s.room))].sort();return head('ห้องเรียน','ห้องเรียนจริงในระบบปี 2569 มี 33 ห้อง; รายการด้านล่างเป็นส่วนหนึ่งของข้อมูลจำลอง')+`<div class="panel"><div class="tablewrap"><table><thead><tr><th>ห้อง</th><th>จำนวนนักเรียนจำลอง</th><th>ครูประจำชั้น</th><th>การดำเนินการ</th></tr></thead><tbody>${rms.map((x,i)=>`<tr><td><b>${x}</b></td><td>${students.filter(s=>s.room===x).length} คน</td><td>ครูตัวอย่าง ${i+1} และครูตัวอย่าง ${i+2}</td><td><button class="btn" data-room="${x}">ดูนักเรียน</button></td></tr>`).join('')}</tbody></table></div></div>`}
function attendancePage(){const rows=scopeRows();return head('เช็กชื่อกิจกรรม','ลองเลือกสถานะการเข้าเรียน ระบบจะคำนวณจำนวนครั้งที่มา/สายให้')+`<div class="notice">ตัวอย่าง: ชุมนุม · ภาคเรียนที่ 2 · สัปดาห์ที่ 1 จากค่าเริ่มต้น 20 สัปดาห์ · เกณฑ์ผ่านยังไม่ได้กำหนด</div><div class="panel"><div class="filters"><select id="attType"><option>กิจกรรมชุมนุม</option><option>กิจกรรมบำเพ็ญประโยชน์</option></select><select id="attWeek"><option>สัปดาห์ที่ 1</option><option>สัปดาห์ที่ 2</option><option>สัปดาห์ที่ 3</option></select></div><div class="tablewrap"><table><thead><tr><th>นักเรียน</th><th>ห้อง</th><th>สถานะการเข้าเรียน</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${safe(s.name)}</b></td><td>${safe(s.room)}</td><td><div class="att">${['มา','สาย','ลา','ขาด'].map(status=>`<button data-att="${s.id}" data-status="${status}" class="${attend[s.id]===status?'selected':''}">${status}</button>`).join('')}</div></td></tr>`).join('')}</tbody></table></div><div class="row"><b>เช็กชื่อแล้ว ${rows.filter(s=>attend[s.id]).length} / ${rows.length} คน</b><span class="pill ok">นับเข้าเรียน: ${rows.filter(s=>['มา','สาย'].includes(attend[s.id])).length} คน</span></div><div class="actions"><button class="btn primary" id="saveAttendance">บันทึกผลตัวอย่าง</button></div></div>`}
function excelPage(){return head('นำเข้า / ส่งออก Excel','ทดลองขั้นตอนนำเข้าและดาวน์โหลดข้อมูลตัวอย่าง')+`<div class="cards2"><div class="panel"><h3>⇧ นำเข้าข้อมูล Excel</h3><div class="notice warn">การจำลองนี้ยังไม่อ่านไฟล์จริง และจะไม่เปลี่ยนข้อมูลนักเรียนของโรงเรียน</div><div class="editbox"><label>รูปแบบการนำเข้า<select id="importMode"><option>อัปเดตเฉพาะรายการในไฟล์</option><option>ซิงก์รายชื่อทั้งหมดตามไฟล์</option></select></label><label>เลือกไฟล์ Excel<input type="file" id="xls" accept=".xlsx,.xls,.csv"></label></div><div class="actions" style="margin-top:15px"><button class="btn primary" id="previewImport">จำลองตรวจสอบก่อนนำเข้า</button></div><div id="importStatus"></div></div><div class="panel"><h3>⇩ ส่งออกข้อมูล</h3><p class="small">ดาวน์โหลดข้อมูลนักเรียนสมมติเป็น CSV สำหรับเปิดด้วย Excel ได้ทันที (ชุดระบบจริงรองรับ XLSX)</p><div class="actions"><button class="btn primary" id="exportCSV">ดาวน์โหลด CSV ทดลอง</button></div><div class="row"><span>ปีการศึกษา</span><b>${year}</b></div><div class="row"><span>จำนวนรายการตัวอย่าง</span><b>${scopeRows().length} คน</b></div></div></div>`}
function issuesPage(){return head('ข้อมูลรอตรวจสอบ','พบ 45 รายการจาก Excel ปี 2569 ที่ควรให้โรงเรียนตรวจทาน')+`<div class="notice warn">หน้านี้เป็นตัวอย่างสถานะการตรวจสอบ ไม่แสดงชื่อหรือเลขประจำตัวจริง</div><div class="panel"><div class="row"><div><b>เลขประจำตัวซ้ำและข้อมูลอาจขัดแย้ง</b><br><small>รอตรวจสอบรายการต้นฉบับ ไม่เขียนทับอัตโนมัติ</small></div><span class="pill warn">15 แถว</span></div><div class="row"><div><b>ชื่อชุมนุมระบุไม่ชัดเจน</b><br><small>ควรจับคู่เข้ารายการชุมนุมที่ถูกต้อง</small></div><span class="pill warn">30 แถว</span></div><div class="row"><div><b>รายชื่อชุมนุมที่จัดกลุ่มเบื้องต้น</b><br><small>ต้องให้ผู้ดูแลยืนยันก่อนใช้ทางการ</small></div><span class="pill">43 กลุ่ม</span></div></div>`}
function usersPage(){return head('บัญชีและสิทธิ์','ดูตัวอย่างระดับสิทธิ์ของผู้ดูแลระบบและครู')+`<div class="panel"><div class="tablewrap"><table><thead><tr><th>บัญชีจำลอง</th><th>บทบาท</th><th>สิทธิ์</th><th>สถานะ</th></tr></thead><tbody>${[['ผู้ดูแลระบบหลัก','Super Admin','ทุกเมนูและการตั้งค่า'],['ผู้ดูแลโรงเรียน','Admin','จัดการข้อมูลและกิจกรรม'],['ครูประจำชั้น ม.1/1','Teacher','นักเรียน ม.1/1'],['ครูชุมนุมคอมพิวเตอร์','Teacher','สมาชิกชุมนุมคอมพิวเตอร์']].map(r=>`<tr><td>${r[0]}</td><td><span class="pill">${r[1]}</span></td><td>${r[2]}</td><td><span class="pill ok">ตัวอย่าง</span></td></tr>`).join('')}</tbody></table></div><p class="small">ใช้ตัวเลือกบทบาทที่มุมบนขวาเพื่อดูเมนูที่แตกต่างกัน</p></div>`}
function logPage(){return head('ประวัติการแก้ไข','แสดงกิจกรรมที่เกิดขึ้นในหน้าจำลองนี้เท่านั้น')+`<div class="panel">${logs.map(x=>`<div class="row"><div><b>${safe(x.type)}</b><br><small>${safe(x.detail)}</small></div><span class="small">${safe(x.date)}</span></div>`).join('')}</div>`}
function modal(title,body,onSave){byId('modalRoot').innerHTML=`<div class="modalwrap"><div class="modal"><h2>${safe(title)}</h2><div class="editbox">${body}</div><div class="modalactions"><button class="btn" id="cancel">ยกเลิก</button><button class="btn primary" id="confirm">ยืนยันบันทึก</button></div></div></div>`;byId('cancel').onclick=closeModal;byId('confirm').onclick=onSave}function closeModal(){byId('modalRoot').innerHTML=''}function log(type,detail){logs.unshift({type,detail,date:new Date().toLocaleTimeString('th-TH')})}function studentEdit(id){let s=students.find(s=>s.id===id);modal(s?'แก้ไขข้อมูลนักเรียน':'เพิ่มนักเรียนตัวอย่าง',`<label>เลขประจำตัวนักเรียน<input id="mCode" value="${safe(s?.code||'')}"/></label><label>ชื่อและนามสกุล<input id="mName" value="${safe(s?.name||'')}"/></label><label>ห้องเรียน<select id="mRoom">${[...new Set(students.map(x=>x.room))].sort().map(r=>`<option ${s?.room===r?'selected':''}>${r}</option>`).join('')}</select></label>`,()=>{let code=byId('mCode').value.trim(),name=byId('mName').value.trim(),room=byId('mRoom').value;if(!code||!name){toast('กรอกเลขประจำตัวและชื่อให้ครบ');return}if(students.some(x=>x.code===code&&x.id!==id)){toast('เลขประจำตัวนี้มีอยู่แล้ว');return}if(s){s.code=code;s.name=name;s.room=room;s.version++;log('แก้ไขข้อมูล',s.name+' · '+room)}else{students.push({id:'SIM-'+Date.now(),code,name,room,club:'',version:1});log('เพิ่มนักเรียน',name+' · '+room)}closeModal();toast('บันทึกเฉพาะข้อมูลจำลองแล้ว');render()})}function studentMove(id){let s=students.find(s=>s.id===id);if(!s)return;let available=role==='club'?clubDefs.filter(c=>c.name==='คอมพิวเตอร์'):clubDefs;modal('ย้ายชุมนุมนักเรียน',`<div class="notice">${safe(s.name)} · ${safe(s.room)}<br>ชุมนุมเดิม: <b>${safe(s.club||'ยังไม่เลือก')}</b></div><label>ชุมนุมใหม่<select id="mClub"><option value="">ยังไม่ได้เลือกชุมนุม</option>${available.map(c=>`<option ${s.club===c.name?'selected':''}>${c.name}</option>`).join('')}</select></label>`,()=>{let target=byId('mClub').value;if(role==='club'&&s.club!=='คอมพิวเตอร์'&&target!=='คอมพิวเตอร์'){toast('คุณไม่มีสิทธิ์ในชุมนุมนี้');return}let c=clubDefs.find(c=>c.name===target);if(c&&c.limit&&counts(target)>=c.limit&&s.club!==target&&role!=='super'&&role!=='admin'){toast('ชุมนุมเต็มแล้ว ให้ผู้ดูแลระบบจัดการ');return}let prev=s.club;s.club=target;s.version++;log('เปลี่ยนชุมนุม',s.name+': '+(prev||'ยังไม่เลือก')+' → '+(target||'ยังไม่เลือก'));closeModal();toast('เปลี่ยนชุมนุมตัวอย่างเรียบร้อย');render()})}
function bind(){main.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>nav(x.dataset.go));main.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>studentEdit(x.dataset.edit));main.querySelectorAll('[data-move]').forEach(x=>x.onclick=()=>studentMove(x.dataset.move));main.querySelectorAll('[data-club]').forEach(x=>x.onclick=()=>{view='students';clubFilter=x.dataset.club;render()});main.querySelectorAll('[data-room]').forEach(x=>x.onclick=()=>{view='students';roomFilter=x.dataset.room;render()});if(byId('newstudent'))byId('newstudent').onclick=()=>studentEdit(null);if(byId('apply'))byId('apply').onclick=()=>{query=byId('search').value;roomFilter=byId('roomFilter').value;clubFilter=byId('clubFilter').value;render()};main.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>{attend[b.dataset.att]=b.dataset.status;render()});if(byId('saveAttendance'))byId('saveAttendance').onclick=()=>{log('บันทึกเช็กชื่อ','สัปดาห์ที่ 1 · '+Object.keys(attend).length+' รายการ');toast('บันทึกการเช็กชื่อในหน้าเว็บจำลองแล้ว')};if(byId('previewImport'))byId('previewImport').onclick=()=>{let f=byId('xls').files[0];byId('importStatus').innerHTML=`<div class="notice warn" style="margin-top:13px"><b>ตัวอย่างผลตรวจสอบ</b><br>ไฟล์: ${safe(f?.name||'ยังไม่ได้เลือกไฟล์')}<br>ระบบสาธิตจะไม่อ่านหรือบันทึกข้อมูลในไฟล์ที่เลือก กรุณาใช้ SchoolHub Live สำหรับการนำเข้าจริง</div>`};if(byId('exportCSV'))byId('exportCSV').onclick=()=>{let lines=[['เลขประจำตัว','ชื่อ-นามสกุล','ห้องเรียน','ชุมนุม'],...scopeRows().map(s=>[s.code,s.name,s.room,s.club])];let csv='\uFEFF'+lines.map(row=>row.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='SchoolHub_ข้อมูลจำลอง_'+year+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('ดาวน์โหลดข้อมูลสมมติแล้ว')}}byId('menu').onclick=()=>byId('app').classList.toggle('open');byId('overlay').onclick=()=>byId('app').classList.remove('open');byId('role').onchange=e=>{role=e.target.value;nav('dashboard')};byId('year').onchange=e=>{year=e.target.value;nav('dashboard')};byId('reset').onclick=()=>{students=JSON.parse(JSON.stringify(original));attend={};logs=[{type:'ระบบ',detail:'รีเซ็ตข้อมูลสาธิต',date:'ตอนนี้'}];nav('dashboard');toast('รีเซ็ตข้อมูลจำลองเรียบร้อย')};render()})();
</script></body></html>
